# Workflow chat-luong code cho PR moi - noi dung day du bai 12 muc 5 (ban cu: 04-4-1-*.yaml)
# Moi PR moi/sua -> request Copilot code review + comment tom tat diff cho nguoi review.
# Chi bao cao + de nghi: CON NGUOI giu chot merge (required checks + branch protection bai 07/15).
name: copilot-code-quality
on:
  pull_request: { types: [opened, synchronize, reopened] }
permissions:
  contents: read
  pull-requests: write                 # de post comment findings
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Collect diff (guardrailed, read-only)
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" --stat > diffstat.txt
          git diff "origin/${{ github.base_ref }}...HEAD" > diff.txt
          head -c 60000 diff.txt > diff-truncated.txt   # cat prompt to, tranh phinh token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Request Copilot code review
        uses: actions/github-script@v7
        with:
          script: |
            // Can repo bat Copilot code review (bai 15); bot doc instructions tu HEAD branch:
            await github.rest.pulls.requestReviewers({
              ...context.repo,
              pull_number: context.issue.number,
              reviewers: ['github-copilot[bot]'],
            }).catch(e => console.log('auto-review skip:', e.message));
      - name: Post diff-summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const stat = require('fs').readFileSync('diffstat.txt', 'utf8');
            const body = `## Auto diff-stat\n\`\`\`\n${stat.slice(0, 3000)}\n\`\`\`\n` +
              `Da request Copilot code review. Nguoi review can thay CI xanh + xu ly findings truoc khi merge.`;
            github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
